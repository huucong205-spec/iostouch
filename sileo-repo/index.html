<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IOSTouch Repo</title>
  <link rel="icon" href="CydiaIcon.png">
  <style>
    :root{color-scheme:dark;--bg:#080d18;--card:#121b2c;--line:#293b59;--text:#ecf4ff;--muted:#9aabc2;--violet:#7c63ff;--cyan:#34d7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#18284a 0,#080d18 55%);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.card{width:min(620px,100%);padding:32px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(160deg,#15213aee,#0e1626ee);box-shadow:0 24px 70px #0009;text-align:center}.icon{width:116px;height:116px;border-radius:26px;box-shadow:0 12px 36px #131a;object-fit:cover}h1{margin:18px 0 5px;font-size:36px}p{color:var(--muted)}.url{margin:22px 0;padding:14px;border:1px solid var(--line);border-radius:12px;background:#08101d;color:#bdeeff;font:14px ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all}.button{display:inline-block;padding:12px 20px;border-radius:12px;background:linear-gradient(135deg,var(--violet),var(--cyan));color:white;text-decoration:none;font-weight:750}.note{font-size:13px;margin-top:22px}a{color:#80e5ff}
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="CydiaIcon.png" alt="IOSTouch">
    <h1>IOSTouch Repo</h1>
    <p>Nguồn Sileo/Zebra chính thức cho agent kết nối IOSTouch qua USB.</p>
    <div class="url">https://huucong205-spec.github.io/iostouch/</div>
    <a class="button" href="sileo://source/https://huucong205-spec.github.io/iostouch/">Thêm vào Sileo</a>
    <p class="note">Yêu cầu iOS 14+, thiết bị jailbreak và ElleKit hoặc MobileSubstrate. Agent sử dụng mã nguồn <a href="https://github.com/lautarovculic/ioscpy">ioscpy</a> theo giấy phép MIT.</p>
  </main>
</body>
</html>
